[preset.0]

; Preset di export Windows, scritto da terminal-gun-scheletro (piano §3.4).
; Il nome qui e il nome nella riga di comando devono combaciare:
;   godot --headless --path . --export-release "Windows Desktop" build/terminal-gun.exe
; Se i due nomi differiscono Godot risponde "Export preset not found" ed esce 1.
;
; export_path e' RELATIVO di proposito: nessun path assoluto di macchina in
; questo file, altrimenti non potrebbe essere versionato (vedi .gitignore).
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
; all_resources: il gioco non usa un filtro su misura, e i modelli GLB e i
; suoni arrivano dalla import di Godot, non dal filesystem grezzo.
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/terminal-gun.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
; Script in token binari compressi: non si leggono a mano dentro l'exe, e il
; gioco non e' un progetto che qualcuno vuole ispezionare a runtime.
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; Nessuna console di debug attaccata a un gioco che parte dal desktop.
debug/export_console_wrapper=0
; PCK dentro l'exe: il file che l'utente copia sul desktop e' uno solo.
; Con PCCK esterno, spostare il solo .exe su un'altra cartella rompe il gioco.
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
; Nessun certificato di firma: non ne abbiamo uno, e una firma falsa sarebbe
; peggio di nessuna firma.
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
; Icona e versione: non abbiamo un .ico in assets/ (solo models/ e sfx/), quindi
; restano vuoti e Godot usa la sua icona di default. Lasciare il campo vuoto e'
; il comportamento normale, non un preset rotto.
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name=""
application/product_name="terminal-gun"
application/file_description="terminal-gun"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false